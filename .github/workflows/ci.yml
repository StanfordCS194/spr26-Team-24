name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexa/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexa/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Runs the suite WITH coverage. `npm run test:coverage` exits non-zero when
      # any global or per-directory threshold in nexa/vitest.config.ts is unmet,
      # so this step is the CI coverage gate (ratchet floor). This replaces the
      # plain `npm run test` — coverage runs the same suite plus enforcement.
      # `tee` keeps the human-readable report in the live log while we capture the
      # text-summary block for the job summary below.
      - name: Run tests with coverage gate
        # `pipefail` is essential: without it the step's exit code is tee's (0),
        # which would silently swallow a coverage-threshold failure.
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-run.log
        shell: bash

      # Publish the v8 text-summary to the GitHub Actions job summary so coverage
      # is visible on every PR without any paid/3rd-party service. Self-contained:
      # no Codecov token required (built-in threshold failure is the gate).
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Coverage summary"
            echo '```'
            sed -n '/Coverage summary/,/=====/p' coverage-run.log | grep -E "Statements|Branches|Functions|Lines" || echo "no coverage summary captured"
            echo '```'
            echo "_Gate: thresholds enforced via vitest (nexa/vitest.config.ts); ratchet floor — see nexa/src/test/README.md._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload lcov + HTML report as an artifact for inspection on the PR.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: nexa/coverage
          if-no-files-found: warn

  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexa/package-lock.json

      - run: npm ci

      # Offline, deterministic routing eval (pure polygon lookups — no network,
      # no LLM, no DB). Gates the build on O2.KR1 routing accuracy: the runner
      # exits non-zero when accuracy is below target, failing this job.
      # The classification LLM eval is intentionally NOT run here — it needs paid
      # API keys / network and would break PRs from forks.
      - name: Routing eval (accuracy gate)
        run: npm run eval:routing

      # Offline boundary-data gate: parses boundaries.json as GeoJSON, asserts
      # every feature's jurisdictionId/priority is consistent with the
      # JURISDICTIONS registry, and runs golden point-in-polygon assertions via
      # the real resolveJurisdiction. Exits non-zero on malformed or desynced
      # boundary data, failing this job.
      - name: Validate jurisdiction boundary GeoJSON
        run: npm run eval:validate-boundaries
